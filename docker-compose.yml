name: ai-contact-api

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_LOG_FILE: /app/logs/app.log
  IP_HASH_SALT: ${IP_HASH_SALT:-local-docker-development-salt-change-me}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_contact}
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-5}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-900}
  AI_ENABLED: "true"
  AI_API_KEY: local-llamacpp
  AI_BASE_URL: http://llamacpp:8080/v1
  AI_MODEL: local-smollm2-135m
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
  EMAIL_ENABLED: "true"
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM_EMAIL: no-reply@example.com
  SMTP_OWNER_EMAIL: owner@example.com
  SMTP_USE_TLS: "false"
  METRICS_API_KEY: ${METRICS_API_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_contact}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_contact}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      [
        "-hf",
        "unsloth/SmolLM2-135M-Instruct-GGUF:Q4_K_M",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "-c",
        "2048",
        "-n",
        "256",
      ]
    volumes:
      - llama_cache:/root/.cache
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      llamacpp:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_logs:
  llama_cache:
