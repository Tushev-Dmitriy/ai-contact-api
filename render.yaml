services:
  - type: web
    name: ai-contact-api
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /api/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 8000
      - key: APP_LOG_LEVEL
        value: INFO
      - key: APP_LOG_FILE
        value: /app/logs/app.log
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: '["http://localhost:3000","http://localhost:5173"]'
      - key: DATABASE_URL
        fromDatabase:
          name: ai-contact-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-contact-redis
          property: connectionString
      - key: IP_HASH_SALT
        generateValue: true
      - key: METRICS_API_KEY
        generateValue: true
      - key: AI_ENABLED
        value: "true"
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: AI_API_KEY
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_OWNER_EMAIL
        sync: false

  - type: keyvalue
    name: ai-contact-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: ai-contact-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: ai_contact
    user: ai_contact
    ipAllowList: []
